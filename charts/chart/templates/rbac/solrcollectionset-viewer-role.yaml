{{- if .Values.rbacHelpers.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "solr-collections-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "solr-collections-operator.resourceName" (dict "suffix" "solrcollectionset-viewer-role" "context" $) }}
rules:
- apiGroups:
  - solrcollections.solr.sis.uw.edu
  resources:
  - solrcollectionsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - solrcollections.solr.sis.uw.edu
  resources:
  - solrcollectionsets/status
  verbs:
  - get
{{- end }}
