apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "solr-collections-operator.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - solrcollections.solr.sis.uw.edu
  resources:
  - solrcollectionsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - solrcollections.solr.sis.uw.edu
  resources:
  - solrcollectionsets/finalizers
  verbs:
  - update
- apiGroups:
  - solrcollections.solr.sis.uw.edu
  resources:
  - solrcollectionsets/status
  verbs:
  - get
  - patch
  - update
